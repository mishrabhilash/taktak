[package]
name = "taktak-core"
description = "TakTak core: global key listening, low-latency audio engine, sound packs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
fastrand = "2.5.0"
log = "0.4.34"
notify = "8.2.0"
rtrb = "0.4.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "mp3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The output device's name from global-scope CoreAudio reads (`audio/device_name.rs`), instead
# of cpal's `description()`, which also queries the device's input side. Both crates already
# come with cpal; these features add nothing to the build.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
x11rb = { version = "0.13.2", default-features = false, features = ["xinput"] }

[[bin]]
name = "taktak-spike"
path = "src/bin/taktak-spike.rs"

[[bin]]
name = "taktak-pack"
path = "src/bin/taktak-pack.rs"

[dev-dependencies]
hound = "3.5.1"
tempfile = "3.27.0"
