[package]
name = "taktak"
description = "TakTak: mechanical keyboard sounds as you type, from the menu bar or tray."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "taktak"

[lib]
name = "taktak_lib"
# Desktop only: no mobile targets, so no staticlib/cdylib.
crate-type = ["rlib"]

[[bin]]
name = "taktak"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
taktak-core = { path = "core" }
# App icons as `data:` URLs (`apps::data_url`, compiled and tested on every OS).
base64 = "0.22.1"
log = "0.4.34"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM/SIGINT quit cleanly (settings saved), on Tauri's own tokio runtime.
tokio = { version = "1", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
# `geteuid`, to trust only this user's single-instance socket (`src/instance.rs`); `getpid`.
libc = "0.2.189"
# Per-app rules and auto-mute (`src/apps.rs`): NSWorkspace observers (frontmost app, session),
# the distributed screen-lock notifications, running apps, app icons and the app picker. The
# same versions tao and wry already build.
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNotificationCenter",
    "CFString",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSFileManager",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Per user session there. On macOS it uses a socket in the shared /tmp, so `src/instance.rs`
# replaces it.
tauri-plugin-single-instance = "2"
# The native folder / .zip picker for "Import Mechvibes pack…" (`src/mechvibes.rs`), used from
# Rust only (no JS API, no capability). macOS uses its own NSOpenPanel, which can offer folders
# and .zip files in one panel.
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3.27.0"
