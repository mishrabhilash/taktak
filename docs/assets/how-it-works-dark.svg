<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="How TakTak works: a key goes down, TakTak on your computer picks that key's sound, and the sound plays about 6 ms later. Nothing goes to the internet.">
<defs><linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8692F"/><stop offset="1" stop-color="#BF4A17"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA36A"/><stop offset="1" stop-color="#FF8040"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#6b5d53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="280" height="150" rx="18" fill="#24201d" stroke="#3d3430" stroke-width="1.5"/>
<text x="160" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="700" font-size="21" fill="#f5efe9">Key down</text>
<text x="160" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="500" font-size="14.5" fill="#a89c92">which physical key, nothing else</text>
<rect x="340" y="20" width="280" height="150" rx="18" fill="#24201d" stroke="#ff8a4c" stroke-width="2"/>
<text x="480" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="700" font-size="21" fill="#f5efe9">TakTak</text>
<text x="480" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="500" font-size="14.5" fill="#a89c92">on your computer, offline</text>
<rect x="660" y="20" width="280" height="150" rx="18" fill="#24201d" stroke="#3d3430" stroke-width="1.5"/>
<text x="800" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="700" font-size="21" fill="#f5efe9">Sound</text>
<text x="800" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="500" font-size="14.5" fill="#a89c92">press + release, ~6 ms</text>
<rect x="130" y="40" width="60" height="60" rx="12.0" fill="#1a1614"/><rect x="135.4" y="43.0" width="49.2" height="44.4" rx="9.0" fill="#332c28" stroke="#40372f" stroke-width="1"/><text x="160.0" y="73.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="700" font-size="20.4" fill="#6f645b">A</text>
<path d="M108 52v26m0 0-7-7m7 7 7-7" fill="none" stroke="#ff8a4c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(444,34) scale(0.07)">
  <rect x="100" y="132" width="824" height="824" rx="184" fill="#000" opacity="0" />
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#skirt)"/>
  <rect x="176" y="136" width="672" height="640" rx="132" fill="url(#top)"/>
  <rect x="176" y="136" width="672" height="640" rx="132" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="6"/>
  <g fill="#fff" fill-opacity="0.96"><rect x="356" y="280" width="312" height="72" rx="36"/><rect x="476" y="280" width="72" height="352" rx="36"/></g>
</g>
<g fill="none" stroke="#ff8a4c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M772 64h10l14-12v40l-14-12h-10z" fill="#ff8a4c" fill-opacity="0.15"/><path d="M806 62a14 14 0 0 1 0 20"/><path d="M814 54a25 25 0 0 1 0 36"/></g>
<line x1="304" y1="95" x2="334" y2="95" stroke="#6b5d53" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="624" y1="95" x2="654" y2="95" stroke="#6b5d53" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="480" y1="172" x2="480" y2="190" stroke="#8f8278" stroke-width="2" stroke-dasharray="3 4"/>
<path d="M458 224h40a12 12 0 0 0 1-24 17 17 0 0 0-32-5 11 11 0 0 0-9 29z" transform="translate(-60 0)" fill="none" stroke="#8f8278" stroke-width="2.4" stroke-linejoin="round"/>
<line x1="392" y1="228" x2="446" y2="194" stroke="#ff6159" stroke-width="3" stroke-linecap="round"/>
<text x="460" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Noto Sans', 'Liberation Sans', sans-serif" font-weight="600" font-size="16" fill="#a89c92">No internet. Nothing stored, logged or sent.</text>
</svg>
