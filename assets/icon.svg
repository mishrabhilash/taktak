<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TakTak app icon: an orange accent keycap seen from above, white "T" legend.
       Rasterized to icon.png by assets/render_icons.py (same geometry), then
       `npx tauri icon assets/icon.png` generates src-tauri/icons. -->
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8692F"/>
      <stop offset="1" stop-color="#BF4A17"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA36A"/>
      <stop offset="1" stop-color="#FF8040"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- soft drop shadow -->
  <rect x="100" y="116" width="824" height="824" rx="184" fill="#000" opacity="0.28" filter="url(#shadow)"/>
  <!-- keycap skirt (the sides) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#skirt)"/>
  <!-- top face, offset upward so more skirt shows at the bottom -->
  <rect x="176" y="136" width="672" height="640" rx="132" fill="url(#top)"/>
  <!-- top-edge highlight -->
  <rect x="176" y="136" width="672" height="640" rx="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>
  <!-- "T" legend -->
  <g fill="#FFFFFF" fill-opacity="0.96">
    <rect x="356" y="280" width="312" height="72" rx="36"/>
    <rect x="476" y="280" width="72" height="352" rx="36"/>
  </g>
</svg>
