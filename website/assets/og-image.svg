<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview image (Open Graph). Rendered to og-image.png with headless Chrome:
       see website/README.md. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ee"/>
      <stop offset="1" stop-color="#f6e7da"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8692F"/>
      <stop offset="1" stop-color="#BF4A17"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA36A"/>
      <stop offset="1" stop-color="#FF8040"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- keycap, from assets/icon.svg scaled to 300 px -->
  <g transform="translate(80 150) scale(0.33)">
    <rect x="100" y="130" width="824" height="824" rx="184" fill="#000" opacity="0.22" filter="url(#shadow)"/>
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#skirt)"/>
    <rect x="176" y="136" width="672" height="640" rx="132" fill="url(#top)"/>
    <g fill="#FFFFFF" fill-opacity="0.96">
      <rect x="356" y="280" width="312" height="72" rx="36"/>
      <rect x="476" y="280" width="72" height="352" rx="36"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#1c1714">
    <text x="470" y="200" font-size="92" font-weight="800" letter-spacing="-3">TakTak</text>
    <text x="790" y="200" font-size="54" font-weight="600" fill="#c2410c" font-family="'Kohinoor Devanagari', 'Noto Sans Devanagari', 'Nirmala UI', sans-serif">टक-टक</text>
    <text x="470" y="290" font-size="46" font-weight="700" letter-spacing="-1">Your keyboard, but it</text>
    <text x="470" y="346" font-size="46" font-weight="700" letter-spacing="-1">goes <tspan fill="#c2410c">TakTak.</tspan></text>
    <rect x="470" y="392" width="610" height="64" rx="16" fill="#ffe1cc"/>
    <text x="494" y="434" font-size="28" font-weight="700" fill="#8a2d08">Fully offline — never uses the internet.</text>
    <text x="470" y="520" font-size="26" font-weight="600" fill="#5b5048">Mechanical keyboard sounds as you type · open source</text>
    <text x="470" y="560" font-size="26" font-weight="600" fill="#5b5048">macOS · Windows · Linux · taktak.tech</text>
  </g>
</svg>
