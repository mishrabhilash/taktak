[package]
name = "pack-maker"
description = "Records or slices keyboard audio into a TakTak sound pack."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
taktak-core = { path = "../../src-tauri/core" }
cpal = "0.18.2"
hound = "3.5.1"
rtrb = "0.4.0"
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
fastrand = "2.5.0"
tempfile = "3.27.0"
